    <link
      rel="stylesheet"

    />

    <script>
      // Theme is opt-in, not automatic. The site is light unless the reader
      // switched it. Runs before paint so there is no flash of the wrong theme.
      // The choice is held in one cookie, which is the only cookie this site
      // sets. That is what the Privacy Policy page says, so it has to be true.
      (function () {
        var dark = document.cookie.indexOf('st_theme=dark') !== -1;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
